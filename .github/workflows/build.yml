name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - name: Publish
        shell: bash
        run: dotnet publish App/AAA.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=0.1.${{ github.run_number }} -o out
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: AAA
          path: out/AAA.exe
          retention-days: 3
      # מהדורה להורדה בלשונית Releases בכל עדכון של main. הקובץ: AAA.exe
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${{ github.ref_name }}"; else TAG="v0.1.${{ github.run_number }}"; fi
          gh release create "$TAG" out/AAA.exe --target "${{ github.sha }}" --title "AAA $TAG" --generate-notes --latest
